[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I"]  # pyflakes + pycodestyle + isort-style import sorting

[tool.ruff.lint.per-file-ignores]
# Django's `startapp` scaffolding leaves these imports in place for the next
# model/admin registration — not a real unused-import bug.
"*/admin.py" = ["F401"]
"*/models.py" = ["F401"]

[tool.ruff.lint.isort]
known-first-party = ["config", "core"]
