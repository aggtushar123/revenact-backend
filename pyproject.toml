[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I"]  # pyflakes + pycodestyle + isort-style import sorting

[tool.ruff.lint.per-file-ignores]
# Django's `startapp` scaffolding leaves these imports in place for the next
# model/admin registration — not a real unused-import bug.
"*/admin.py" = ["F401"]
"*/models.py" = ["F401"]
# Auto-generated by `makemigrations` — not hand-written, don't lint them.
"*/migrations/*.py" = ["E501", "I001"]

[tool.ruff.lint.isort]
known-first-party = ["config", "core", "services"]
