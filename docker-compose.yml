services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: revenact
      POSTGRES_PASSWORD: revenact
      POSTGRES_DB: revenact
    ports:
      - "5432:5432"
    volumes:
      - revenact_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U revenact"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  revenact_pgdata:
