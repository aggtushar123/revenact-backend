name: CI

on:
  push:
    branches: ["main", "master"]
  pull_request:
    branches: ["main", "master"]

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30  # well above the suite's normal run; a hung runner must not block deploys for hours

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: revenact
          POSTGRES_PASSWORD: revenact
          POSTGRES_DB: revenact
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U revenact"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

    env:
      SECRET_KEY: ci-test-key
      DEBUG: "False"
      ALLOWED_HOSTS: localhost,127.0.0.1
      DATABASE_URL: postgres://revenact:revenact@localhost:5432/revenact  # soc2:ignore ephemeral CI service db
      CORS_ALLOWED_ORIGINS: http://localhost:5173

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
          cache: "pip"
          cache-dependency-path: requirements-dev.txt

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Lint (ruff check)
        run: ruff check .

      - name: Format check (ruff format)
        run: ruff format --check .

      - name: Run migrations
        run: python manage.py migrate --noinput

      - name: Run tests
        run: python manage.py test

  # Continuous deployment (SOC2:CHG-07): after this repo's tests and the
  # soc2-gates run for the same commit both pass, log into Azure with OpenID
  # Connect (no stored secret) as the deployer identity and run deploy.sh on
  # the VM through Azure's run-command — SSH stays closed to GitHub's runners.
  # deploy.sh pulls main of both repos, so a push to either repo deploys both.
  deploy:
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    concurrency:
      group: deploy-production
      cancel-in-progress: false
    permissions:
      id-token: write
      contents: read
      actions: read
    environment: production
    steps:
      - name: Wait for soc2-gates on this commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for i in $(seq 1 60); do
            c=$(gh api "repos/${{ github.repository }}/actions/runs?head_sha=${{ github.sha }}&event=push" \
                 --jq '.workflow_runs[] | select(.name=="soc2-gates") | .conclusion // "pending"' | head -1)
            echo "soc2-gates: ${c:-not started}"
            case "$c" in
              success) exit 0 ;;
              failure|cancelled|timed_out) echo "security gates did not pass; not deploying"; exit 1 ;;
            esac
            sleep 20
          done
          echo "gave up waiting for soc2-gates"; exit 1
      - uses: azure/login@7184910d9eb2b1c5e48f7073824a90609bb9b6d6 # v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      - name: Run deploy.sh on the VM
        # Azure runs one command at a time per VM: when the other repo's deploy
        # is mid-flight this call can fail (conflict, or its output blob is not
        # there yet), so wait and try again. deploy.sh itself takes a lock.
        run: |
          for attempt in 1 2 3 4; do
            if az vm run-command invoke -g revenact-rg -n revenact-vm --command-id RunShellScript \
                 --scripts "cd /opt/revenact && DEPLOY_ACTOR='github-actions:${{ github.actor }}:${{ github.repository }}@${{ github.sha }}' ./deploy.sh" \
                 --query 'value[0].message' -o tsv | tee deploy-output.txt \
               && grep -q '^Deployed https://' deploy-output.txt; then
              exit 0
            fi
            echo "deploy attempt $attempt did not complete; retrying in 90 s"
            sleep 90
          done
          echo "deploy did not complete after 4 attempts"; exit 1
