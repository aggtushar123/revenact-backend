name: CI

on:
  push:
    branches: ["main", "master"]
  pull_request:
    branches: ["main", "master"]

# Shared by the lint job (shard check imports the test modules) and every
# test shard.
env:
  SECRET_KEY: ci-test-key
  DEBUG: "False"
  ALLOWED_HOSTS: localhost,127.0.0.1
  DATABASE_URL: postgres://revenact:revenact@localhost:5432/revenact  # soc2:ignore ephemeral CI service db
  CORS_ALLOWED_ORIGINS: http://localhost:5173
  TEST_SHARDS: 4  # keep in step with test-shard's matrix below

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
          cache: "pip"
          cache-dependency-path: requirements-dev.txt

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Lint (ruff check)
        run: ruff check .

      - name: Format check (ruff format)
        run: ruff format --check .

      - name: Shards cover every test exactly once
        # Rebuilds each shard from its labels and compares the union with the
        # full discovered suite: no test dropped, none run twice.
        run: python scripts/ci_shard_labels.py --check "$TEST_SHARDS"

  # The suite (3,492 tests on 2026-10-03) took 18-28 min on one runner, so it
  # is split by test class across parallel runners; each shard is a full copy
  # of the old test job (postgres, migrations, --parallel auto).
  test-shard:
    name: test-shard (${{ matrix.shard }}/${{ strategy.job-total }})
    runs-on: ubuntu-latest
    timeout-minutes: 30  # well above a shard's normal run; a hung runner must not block deploys for hours
    strategy:
      fail-fast: false  # report every shard's failures, not just the first
      matrix:
        shard: [1, 2, 3, 4]

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: revenact
          POSTGRES_PASSWORD: revenact
          POSTGRES_DB: revenact
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U revenact"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
          cache: "pip"
          cache-dependency-path: requirements-dev.txt

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Run migrations
        run: python manage.py migrate --noinput

      - name: Run tests (shard ${{ matrix.shard }})
        # One process per runner core. Never run serially: the whole suite on
        # one runner outgrew the 30-minute timeout (26-29 min by 2026-09-25).
        run: |
          test "${{ strategy.job-total }}" = "$TEST_SHARDS" || { echo "matrix size and TEST_SHARDS differ"; exit 1; }
          labels=$(python scripts/ci_shard_labels.py "${{ matrix.shard }}" "$TEST_SHARDS")
          echo "$(echo "$labels" | wc -l) test classes in this shard"
          # shellcheck disable=SC2086  # one argument per label, on purpose
          # -v 2 names each test class as its worker reports it, so a hung
          # class is the one that never appears (main hung after #80, 2026-10-03).
          python manage.py test --parallel auto --noinput -v 2 $labels

  # The one required status check (main ruleset requires a check named
  # `test`): green only when lint and every shard passed. deploy needs it.
  test:
    needs: [lint, test-shard]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: All shards and lint passed
        run: |
          echo "lint: ${{ needs.lint.result }}, test-shard: ${{ needs.test-shard.result }}"
          test "${{ needs.lint.result }}" = success
          test "${{ needs.test-shard.result }}" = success

  # Continuous deployment (SOC2:CHG-07): after this repo's tests (the `test`
  # job, green only when lint and every test shard passed) and the soc2-gates
  # run for the same commit both pass, log into Azure with OpenID Connect (no
  # stored secret) as the deployer identity and run deploy.sh on the VM through
  # Azure's run-command — SSH stays closed to GitHub's runners.
  # deploy.sh pulls main of both repos, so a push to either repo deploys both.
  deploy:
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    concurrency:
      group: deploy-production
      cancel-in-progress: false
    permissions:
      id-token: write
      contents: read
      actions: read
    environment: production
    steps:
      - name: Wait for soc2-gates on this commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for i in $(seq 1 60); do
            c=$(gh api "repos/${{ github.repository }}/actions/runs?head_sha=${{ github.sha }}&event=push" \
                 --jq '.workflow_runs[] | select(.name=="soc2-gates") | .conclusion // "pending"' | head -1)
            echo "soc2-gates: ${c:-not started}"
            case "$c" in
              success) exit 0 ;;
              failure|cancelled|timed_out) echo "security gates did not pass; not deploying"; exit 1 ;;
            esac
            sleep 20
          done
          echo "gave up waiting for soc2-gates"; exit 1
      - uses: azure/login@a641126d1b8aa4d1fa005f4f92df94a3a4c4c906 # v3.1.0
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      - name: Run deploy.sh on the VM
        # Azure runs one command at a time per VM: when the other repo's deploy
        # is mid-flight this call can fail (conflict, or its output blob is not
        # there yet), so wait and try again. deploy.sh itself takes a lock.
        run: |
          for attempt in 1 2 3 4; do
            if az vm run-command invoke -g revenact-rg -n revenact-vm --command-id RunShellScript \
                 --scripts "cd /opt/revenact && DEPLOY_ACTOR='github-actions:${{ github.actor }}:${{ github.repository }}@${{ github.sha }}' ./deploy.sh" \
                 --query 'value[0].message' -o tsv | tee deploy-output.txt \
               && grep -q '^Deployed https://' deploy-output.txt; then
              exit 0
            fi
            echo "deploy attempt $attempt did not complete; retrying in 90 s"
            sleep 90
          done
          echo "deploy did not complete after 4 attempts"; exit 1
